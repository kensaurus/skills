<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 370" width="880" height="370" role="img" aria-label="Ask first, test first. You say: grill me before I build a referral program. Reward on signup or on first payment? I'd pick first payment.. You say: first payment. Decision log saved. You approved it.. You say: build it from those decisions. The workflow-build-feature playbook runs. Spec, then a failing test. Smallest change that passes. Smoke test passed. PR opened..">
