<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="How the completion gate decides the work is done. 1. State file: The checklist, written to disk. It survives context compaction. 2. Stop hook: Runs when the agent tries to stop. Open items? Send it back. 3. Judge: A second agent, fresh context. Request, diff, and test evidence. open items remain: keep working (3 tries with no progress, then give up). PASS: done. CONTINUE: back to work. BLOCKED: a person must act.">
<title>How the completion gate decides the work is done</title>
<defs>
<marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#18181b"/></marker>
<marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b45309"/></marker>
</defs>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}</style>
<rect width="1200" height="470" rx="18" fill="#fafaf9"/>
<text x="600" y="66" text-anchor="middle" font-size="26" font-weight="700" fill="#18181b">How the completion gate decides the work is done</text>

<rect x="40" y="120" width="300" height="150" rx="14" fill="#fff" stroke="#18181b" stroke-width="2"/>
<circle cx="74" cy="158" r="16" fill="#a3e635" stroke="#18181b" stroke-width="2"/>
<text x="74" y="164" text-anchor="middle" font-size="17" font-weight="700" fill="#18181b">1</text>
<text x="102" y="165" font-size="22" font-weight="700" fill="#18181b">State file</text>
<text x="62" y="208" font-size="16" fill="#3f3f46">The checklist, written to disk.</text>
<text x="62" y="234" font-size="16" fill="#3f3f46">It survives context compaction.</text>
<rect x="450" y="120" width="300" height="150" rx="14" fill="#fff" stroke="#18181b" stroke-width="2"/>
<circle cx="484" cy="158" r="16" fill="#a3e635" stroke="#18181b" stroke-width="2"/>
<text x="484" y="164" text-anchor="middle" font-size="17" font-weight="700" fill="#18181b">2</text>
<text x="512" y="165" font-size="22" font-weight="700" fill="#18181b">Stop hook</text>
<text x="472" y="208" font-size="16" fill="#3f3f46">Runs when the agent tries to stop.</text>
<text x="472" y="234" font-size="16" fill="#3f3f46">Open items? Send it back.</text>
<rect x="860" y="120" width="300" height="150" rx="14" fill="#fff" stroke="#18181b" stroke-width="2"/>
<circle cx="894" cy="158" r="16" fill="#a3e635" stroke="#18181b" stroke-width="2"/>
<text x="894" y="164" text-anchor="middle" font-size="17" font-weight="700" fill="#18181b">3</text>
<text x="922" y="165" font-size="22" font-weight="700" fill="#18181b">Judge</text>
<text x="882" y="208" font-size="16" fill="#3f3f46">A second agent, fresh context.</text>
<text x="882" y="234" font-size="16" fill="#3f3f46">Request, diff, and test evidence.</text>
<line x1="348" y1="195" x2="432" y2="195" stroke="#18181b" stroke-width="2.5" marker-end="url(#a)"/>
<text x="395" y="181" text-anchor="middle" font-size="14" fill="#3f3f46">agent tries to stop</text>
<line x1="758" y1="195" x2="842" y2="195" stroke="#18181b" stroke-width="2.5" marker-end="url(#a)"/>
<text x="805" y="181" text-anchor="middle" font-size="14" fill="#3f3f46">all items checked</text>
<path d="M 600 278 V 324 H 190 V 288" fill="none" stroke="#b45309" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#b)"/>
<text x="395" y="350" text-anchor="middle" font-size="15" fill="#92400e">open items remain: keep working (3 tries with no progress, then give up)</text>
<text x="882" y="316" font-size="16" font-weight="600" fill="#15803d">PASS: done</text>
<text x="882" y="344" font-size="16" font-weight="600" fill="#b45309">CONTINUE: back to work</text>
<text x="882" y="372" font-size="16" font-weight="600" fill="#b91c1c">BLOCKED: a person must act</text>
</svg>
