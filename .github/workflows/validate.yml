name: validate

on:
  pull_request:
    paths:
      - "skills/**"
      - "skills-cursor/**"
      - "commands/**"
      - "agents/**"
      - "rules/**"
      - "bin/**"
      - "scripts/**"
      - "mcp/**"
      - ".mcp.json"
      - "llms.txt"
      - "SECURITY.md"
      - "README.md"
      - "package.json"
      - "docs/**"
  push:
    branches: [main]

jobs:
  spec:
    name: Skill spec + install smoke test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Validate skills against the Agent Skills spec
        run: node scripts/validate-skills.mjs
      - name: Skill count sync check
        run: node scripts/check-skill-count.mjs
      - name: README skill index sync check
        run: node scripts/generate-skill-index.mjs --check
      - name: Secret scanner self-test
        run: node scripts/scan-secrets.mjs --self-test
      - name: MCP pin check
        run: node scripts/check-mcp-pins.mjs
      - name: Living-docs fact check
        run: node scripts/check-docs-facts.mjs
      - name: Skill cross-ref check (doubled prefixes / stale aliases / prompt fossils)
        run: node scripts/check-skill-refs.mjs --self-test && node scripts/check-skill-refs.mjs
      - name: Markdown fence check (no nested or unclosed code fences)
        run: node scripts/check-md-structure.mjs --self-test && node scripts/check-md-structure.mjs
      - name: Completion-gate tests (Cursor + Claude Stop payloads)
        run: node scripts/test-completion-gate.mjs
      - name: Install smoke test (files preserved, --skill works)
        run: node scripts/test-install.mjs
      - name: Dead-code ratchet (Knip, default + production, max-issues 0)
        run: npm run -s check:dead-code && npm run -s check:dead-code:prod
