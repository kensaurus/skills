name: skill-count

on:
  pull_request:
    paths:
      - "skills/**"
      - "skills-cursor/**"
      - "commands/**"
      - "agents/**"
      - "rules/project-starter/**"
      - "README.md"
      - "package.json"
      - "llms.txt"
      - "docs/CATALOG.md"
      - "docs/PROMOTION.md"
      - "docs/GETTING-STARTED.md"
      - "docs/README.md"
      - ".cursor-plugin/plugin.json"
      - ".claude-plugin/plugin.json"
      - ".claude-plugin/marketplace.json"
      - "scripts/check-skill-count.mjs"
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Verify README skill count matches skills/*/SKILL.md
        run: node scripts/check-skill-count.mjs
