name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write   # required for npm OIDC trusted publishing

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Ensure npm supports OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Verify skill count
        run: node scripts/check-skill-count.mjs

      - name: Verify README skill index is in sync
        run: node scripts/generate-skill-index.mjs --check

      - name: Validate skills against the Agent Skills spec
        run: node scripts/validate-skills.mjs

      - name: Install smoke test
        run: node scripts/test-install.mjs

      - name: Secret scanner self-test
        run: node scripts/scan-secrets.mjs --self-test

      - name: MCP pin check
        run: node scripts/check-mcp-pins.mjs

      - name: Living-docs fact check
        run: node scripts/check-docs-facts.mjs

      - name: Skill cross-ref check
        run: node scripts/check-skill-refs.mjs --self-test && node scripts/check-skill-refs.mjs

      - name: Dead-code ratchet (Knip, max-issues 0)
        run: npm run -s check:dead-code && npm run -s check:dead-code:prod

      # Staged publishing (owner, 2026-10-01): the trusted publisher for
      # @kensaurus/skills allows only `npm stage publish`. CI stages the version;
      # it goes live when the owner approves it with 2FA on npmjs.com or with
      # `npm stage approve <id>`. A compromised run can stage, never ship.
      # NPM_TOKEN is an optional fallback, exported only when set so OIDC is used.
      - name: Stage for publishing (owner approves with 2FA)
        run: |
          if [ -n "${NPM_TOKEN:-}" ]; then
            export NODE_AUTH_TOKEN="$NPM_TOKEN"
          fi
          npm stage publish --provenance --access public
          echo "::notice::Staged $(node -p "require('./package.json').name + '@' + require('./package.json').version"). Approve it on npmjs.com (package → Staged) or run: npm stage list"
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
